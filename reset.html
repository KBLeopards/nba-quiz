<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>기록 초기화 (1회용)</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#F5F2FA;color:#1D1530;margin:0;padding:24px 16px}
.box{max-width:480px;margin:0 auto;background:#fff;border:1px solid #E2DAEF;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}
p{margin:0;font-size:14px;line-height:1.6}
input{border:1.5px solid #E2DAEF;border-radius:10px;padding:12px;font-size:16px}
button{border:0;border-radius:10px;padding:14px;font-size:15px;font-weight:700;color:#fff;background:#4A2D86}
button.danger{background:#BE3B35}
button:disabled{opacity:.45}
#log{font-size:13px;white-space:pre-wrap;color:#6A6180}
</style>
</head>
<body>
<div class="box">
  <h1>기록 초기화 (1회용)</h1>
  <p><b>지워지는 것:</b> 퀴즈, 답안, 채팅, 포인트 장부, 교환 내역. 모든 회원 포인트와 월별 순위는 0이 돼요.<br><b>남는 것:</b> 가입자 계정, 승인 상태, 리그 명단.</p>
  <button id="login">운영자 구글 계정으로 로그인</button>
  <input id="confirm" placeholder="확인을 위해 초기화 라고 입력" autocomplete="off">
  <button id="go" class="danger" disabled>전부 초기화</button>
  <div id="log"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const log = t => { document.getElementById("log").textContent += t + "\n"; };
const go = document.getElementById("go");
document.getElementById("login").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => log("로그인 실패: " + e.code));
onAuthStateChanged(auth, u => { if (u) { log(u.email + " 로 로그인됨"); go.disabled = false; } });
async function run(ops) { for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db); ops.slice(i, i + 400).forEach(o => o(b)); await b.commit(); } }
go.onclick = async () => {
  if (document.getElementById("confirm").value.trim() !== "초기화") { log("확인 칸에 '초기화'라고 입력해 주세요"); return; }
  go.disabled = true; log("지우는 중…");
  try {
    const refs = [];
    const qz = await getDocs(collection(db, "quizzes"));
    for (const d of qz.docs) for (let n = 1; n <= 5; n++) { const m = await getDocs(collection(db, "chats", d.id + "_" + n, "msgs")); m.docs.forEach(x => refs.push(x.ref)); }
    qz.docs.forEach(d => refs.push(d.ref));
    for (const c of ["answers", "ledger", "exchanges"]) { const g = await getDocs(collection(db, c)); g.docs.forEach(d => refs.push(d.ref)); }
    const us = await getDocs(collection(db, "users")), pf = await getDocs(collection(db, "profiles"));
    const ops = refs.map(r => b => b.delete(r));
    us.docs.forEach(d => ops.push(b => b.update(d.ref, { points: 0 })));
    pf.docs.forEach(d => ops.push(b => b.update(d.ref, { m: {} })));
    await run(ops);
    log("완료! 삭제 " + refs.length + "건 · 회원 " + us.size + "명 포인트 0 · 이 페이지는 이제 닫아도 돼요");
  } catch (e) { log("오류: " + (e.code || e.message) + " (운영자 계정인지 확인. 다시 누르면 남은 것만 지워요)"); go.disabled = false; }
};
</script>
</body>
</html>
